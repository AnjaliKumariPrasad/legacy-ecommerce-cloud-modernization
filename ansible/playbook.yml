---
- name: Configure Bilal Store EC2
  hosts: app
  become: true

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: true

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Enable Docker service
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install unzip
      apt:
        name: unzip
        state: present

    - name: Download AWS CLI installer
      get_url:
        url: https://awscli.amazonaws.com/v2/install.sh
        dest: /tmp/awscliv2-install.sh
        mode: "0755"

    - name: Install AWS CLI v2
      command: /tmp/awscliv2-install.sh --system
      args:
        creates: /usr/local/bin/aws

    - name: Remove AWS CLI installer
      file:
        path: /tmp/awscliv2-install.sh
        state: absent